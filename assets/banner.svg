<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">Shadowrocket RU CN Routing</title>
  <desc id="desc">A routing profile for use in Russia. Russian and Chinese services direct, selected services through a proxy. Russia v2.0 Beta.</desc>
  <defs>
